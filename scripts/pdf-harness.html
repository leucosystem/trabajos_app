<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Banco de pruebas PDF</title>
  </head>
  <body>
    <script type="module">
      import { generateJobPdf } from "/src/utils/jobPdf.js";

      const SIZES = [
        [1600, 1200],
        [1200, 1600],
        [1500, 1500],
        [2400, 1000],
      ];

      function makePhoto(index) {
        const [w, h] = SIZES[index % SIZES.length];
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = `hsl(${(index * 47) % 360} 55% 60%)`;
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 12;
        ctx.strokeRect(6, 6, w - 12, h - 12);
        ctx.fillStyle = "#000";
        ctx.font = `bold ${Math.round(h / 3)}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(`#${index + 1}`, w / 2, h / 2);
        return new Promise((resolve) =>
          canvas.toBlob(
            (blob) => resolve({ file: new File([blob], `foto-${index + 1}.jpg`, { type: "image/jpeg" }), info: `Foto ${index + 1} de prueba` }),
            "image/jpeg",
            0.9
          )
        );
      }

      function makeSignature() {
        const canvas = document.createElement("canvas");
        canvas.width = 600;
        canvas.height = 200;
        const ctx = canvas.getContext("2d");
        ctx.strokeStyle = "#123";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(20, 150);
        ctx.bezierCurveTo(120, 20, 200, 200, 300, 80);
        ctx.bezierCurveTo(380, 10, 460, 180, 580, 60);
        ctx.stroke();
        return canvas.toDataURL("image/png");
      }

      function blobToBase64(blob) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(",")[1]);
          reader.readAsDataURL(blob);
        });
      }

      window.makePdf = async (photoCount, signed) => {
        const photos = [];
        for (let i = 0; i < photoCount; i += 1) photos.push(await makePhoto(i));
        const result = await generateJobPdf({
          formData: {
            cliente: "Cliente de prueba",
            operario: "Operario Prueba",
            fecha: "2026-10-03",
            descripcion: "Trabajo de prueba para revisar la maquetación del PDF.",
            cantidad: "12.5",
            unidad: "horas",
          },
          photos,
          signature: signed ? makeSignature() : null,
          output: "blob",
        });
        return blobToBase64(result.blob);
      };
      window.harnessReady = true;
    </script>
  </body>
</html>
